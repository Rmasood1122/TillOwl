; Installs to pytest.ini at the repo root (G1-protected). The only pytest configuration
; allowed in the repo: CI fails on any other pytest.ini, tox.ini or setup.cfg [tool:pytest]
; section, or [tool.pytest*] table in pyproject.toml. Always run with
;   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -c pytest.ini --rootdir=. <paths>
[pytest]
testpaths = tests
; xunit1 puts the test file path on each <testcase>, which check_evidence.py junit reads.
junit_family = xunit1
; An unexpected pass of an xfail test fails the run; xfails themselves fail the gate check.
xfail_strict = true
; An empty parametrize list fails at collection instead of silently skipping.
empty_parameter_set_mark = fail_at_collect
; importlib mode lets two steps use the same test file name without __init__.py files.
addopts = -ra --strict-markers --strict-config -p no:cacheprovider --import-mode=importlib

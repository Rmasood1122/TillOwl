# Installs to .github/workflows/governance.yml (G1-protected).
# G1 + G3 in one job ("governance") and G2 in "founder-approval". Both are required checks.
#
# pull_request_target runs THIS file as it is on the base branch, and the tools are checked
# out from the base branch too, so a PR cannot weaken the checks that judge it. The PR's files
# are only read as data (git diff, JSON, text). Never add a step here that runs code from "pr/".
# No path filters: a required check skipped by a path filter stays Pending and blocks merging
# (https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks).
name: governance

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: governance-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  FOUNDER_LOGIN: Rmasood1122
  SECOND_OWNER_LOGIN: Ahmad317-Engineer

jobs:
  governance:
    name: governance
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted tools (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out the change under review (read as data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: G1 gate integrity and G3 done-means-evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          TOOLS=trusted/tools
          if [ ! -f "$TOOLS/check_evidence.py" ]; then
            echo "::warning::Bootstrap: the base branch has no tools yet, so the PR's own copy is used. This is acceptable only for the governance install PR."
            TOOLS=pr/tools
          fi
          if [ "$EVENT" = "pull_request_target" ]; then
            python "$TOOLS/check_evidence.py" --root pr ci --base "origin/$BASE_REF" --head HEAD \
              --branch "$HEAD_REF" --repo "$GITHUB_REPOSITORY" --verify-runs
          else
            python "$TOOLS/check_evidence.py" --root pr validate --all
            python "$TOOLS/check_evidence.py" --root pr manifest
          fi
          python "$TOOLS/build_progress.py" --root pr

  founder-approval:
    name: founder-approval
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out trusted tools (base branch)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: trusted
          persist-credentials: false
      - name: Check out the change under review (read as data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: G2 founder approval on the latest commit (re-run this job after approving)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          TOOLS=trusted/tools
          [ -f "$TOOLS/check_evidence.py" ] || TOOLS=pr/tools
          python "$TOOLS/check_evidence.py" --root pr approval --pr "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" --founder "$FOUNDER_LOGIN" --second "$SECOND_OWNER_LOGIN"
